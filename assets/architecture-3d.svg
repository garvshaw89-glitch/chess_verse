<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <radialGradient id="archBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#020617" stop-opacity="1" />
      <stop offset="100%" stop-color="#00020a" stop-opacity="1" />
    </radialGradient>

    <!-- Slab Gradients -->
    <linearGradient id="slabL4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="slabL3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="slabL2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="slabL1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1" />
    </linearGradient>

    <filter id="archGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes busPulseDown {
        0% { stroke-dashoffset: 60; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes floatSlab1 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, -6px); }
      }
      @keyframes floatSlab2 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, -5px); }
      }
      @keyframes floatSlab3 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, -4px); }
      }
      @keyframes floatSlab4 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, -3px); }
      }

      .bus-pulse {
        stroke-dasharray: 6 6;
        animation: busPulseDown 2s linear infinite;
      }
      .slab-4 { animation: floatSlab1 4.5s ease-in-out infinite; }
      .slab-3 { animation: floatSlab2 4.5s ease-in-out infinite; animation-delay: 0.2s; }
      .slab-2 { animation: floatSlab3 4.5s ease-in-out infinite; animation-delay: 0.4s; }
      .slab-1 { animation: floatSlab4 4.5s ease-in-out infinite; animation-delay: 0.6s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="16" fill="url(#archBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Title Header -->
  <g transform="translate(50, 42)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="70" y="16" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">
      SYSTEM ARCHITECTURE
    </text>

    <text x="0" y="54" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="0.5">
      Decoupled 4-Layer 3D Engine Architecture
    </text>
    <text x="0" y="76" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Zero latency data-bus connecting authoritative FIDE logic, WebGL renderer, and procedural audio
    </text>
  </g>

  <!-- 3D Isometric Stack (Layers centered horizontally at X: 480) -->
  <!-- Layer 4: UI & Navigation (Top Slab, Y: 130) -->
  <g class="slab-4" transform="translate(480, 130)">
    <!-- 3D Slab Thickness -->
    <polygon points="0,0 260,35 260,47 0,82 -260,47 -260,35" fill="#0369a1" opacity="0.8" />
    <!-- 3D Top Face -->
    <polygon points="0,0 260,35 0,70 -260,35" fill="url(#slabL4)" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Text on Face -->
    <text x="0" y="32" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">
      LAYER 4: REACT 18 + TAILWIND + HUD CONTROLS
    </text>
    <text x="0" y="48" text-anchor="middle" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      GameClock • Captured Pieces • Move Log • 3D Modals
    </text>
  </g>

  <!-- Vertical Connecting Bus L4 -> L3 -->
  <line x1="280" y1="175" x2="280" y2="205" stroke="#38bdf8" stroke-width="2" class="bus-pulse" />
  <line x1="680" y1="175" x2="680" y2="205" stroke="#38bdf8" stroke-width="2" class="bus-pulse" />

  <!-- Layer 3: 3D Graphics & WebGL Scene Graph (Y: 210) -->
  <g class="slab-3" transform="translate(480, 210)">
    <polygon points="0,0 260,35 260,47 0,82 -260,47 -260,35" fill="#6b21a8" opacity="0.8" />
    <polygon points="0,0 260,35 0,70 -260,35" fill="url(#slabL3)" stroke="#a855f7" stroke-width="1.5" />

    <text x="0" y="32" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">
      LAYER 3: THREE.JS + REACT THREE FIBER + PCF SHADOWS
    </text>
    <text x="0" y="48" text-anchor="middle" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      Faceted Procedural Meshes • Smooth CameraController • Particle Bursts
    </text>
  </g>

  <!-- Vertical Connecting Bus L3 -> L2 -->
  <line x1="280" y1="255" x2="280" y2="285" stroke="#a855f7" stroke-width="2" class="bus-pulse" />
  <line x1="680" y1="255" x2="680" y2="285" stroke="#a855f7" stroke-width="2" class="bus-pulse" />

  <!-- Layer 2: Kinematics & Procedural Audio Synthesizer (Y: 290) -->
  <g class="slab-2" transform="translate(480, 290)">
    <polygon points="0,0 260,35 260,47 0,82 -260,47 -260,35" fill="#92400e" opacity="0.8" />
    <polygon points="0,0 260,35 0,70 -260,35" fill="url(#slabL2)" stroke="#f59e0b" stroke-width="1.5" />

    <text x="0" y="32" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">
      LAYER 2: KINEMATICS PHYSICS &amp; PROCEDURAL WEB AUDIO
    </text>
    <text x="0" y="48" text-anchor="middle" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      Parabolic Arc Flight • Angular Flight Tilting • Zero-Asset Sound Synthesizer
    </text>
  </g>

  <!-- Vertical Connecting Bus L2 -> L1 -->
  <line x1="280" y1="335" x2="280" y2="365" stroke="#f59e0b" stroke-width="2" class="bus-pulse" />
  <line x1="680" y1="335" x2="680" y2="365" stroke="#f59e0b" stroke-width="2" class="bus-pulse" />

  <!-- Layer 1: Authoritative Chess Core & Reactive Store (Y: 370) -->
  <g class="slab-1" transform="translate(480, 370)">
    <polygon points="0,0 260,35 260,47 0,82 -260,47 -260,35" fill="#065f46" opacity="0.8" />
    <polygon points="0,0 260,35 0,70 -260,35" fill="url(#slabL1)" stroke="#10b981" stroke-width="1.5" />

    <text x="0" y="32" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">
      LAYER 1: CHESS.JS CORE + ZUSTAND ATOMIC STATE
    </text>
    <text x="0" y="48" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      FIDE Rule Validation • PGN/FEN Rewind • Device Benchmarking Tier
    </text>
  </g>
</svg>
