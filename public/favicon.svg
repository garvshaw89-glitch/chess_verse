<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.2" />
    </linearGradient>
    <filter id="pieceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle gold rim -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Iconic Chess Knight Silhouette -->
  <g filter="url(#pieceGlow)">
    <!-- Knight Body & Mane -->
    <path d="M22 47 C22 47, 21 41, 23 37 C24.5 34, 28 32, 29 28 C29.8 24.5, 28.5 22, 28 19 C27.5 16, 29 14, 32 14 C33.5 14, 35 15, 36 17 C37.5 16, 40 16.5, 41 18 C41.8 19.5, 41 21.5, 43 23 C45.5 24.8, 48 27, 47 31 C46 34.5, 42.5 35, 40 34 C38 33.2, 37 32, 35.5 33 C33 34.5, 34 39, 39 42 C41 43.2, 42 45, 42 47 Z" fill="url(#goldGrad)" />
    
    <!-- Knight Eye -->
    <circle cx="38.5" cy="23.5" r="1.5" fill="#09090B" />
    
    <!-- Knight Snout Nostril Notch -->
    <path d="M44 29 C43 29, 42.5 28, 43.5 27.5 C44.5 27, 45.5 28, 44 29 Z" fill="#09090B" opacity="0.75" />

    <!-- Knight Mane Cuts for Depth -->
    <path d="M29 22 C32 23, 33 26, 32 28" fill="none" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M26 31 C29 32, 30 35, 28 38" fill="none" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Heavy Pedestal / Base -->
    <rect x="18" y="47" width="28" height="4.5" rx="1.5" fill="url(#goldGrad)" />
    <rect x="15" y="52" width="34" height="4.5" rx="2" fill="url(#goldGrad)" />
  </g>
</svg>
