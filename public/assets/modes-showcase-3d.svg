<!-- Forwarding copy of modes-showcase-3d.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <radialGradient id="modesBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#020617" stop-opacity="1" />
      <stop offset="100%" stop-color="#00020a" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <style>
      @keyframes floatCard1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      @keyframes floatCard2 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
      @keyframes floatCard3 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
      @keyframes floatCard4 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-9px); } }
      @keyframes neonPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
      .card-1 { animation: floatCard1 4.2s ease-in-out infinite; }
      .card-2 { animation: floatCard2 4.6s ease-in-out infinite; animation-delay: 0.3s; }
      .card-3 { animation: floatCard3 4.0s ease-in-out infinite; animation-delay: 0.6s; }
      .card-4 { animation: floatCard4 4.4s ease-in-out infinite; animation-delay: 0.9s; }
      .live-dot { animation: neonPulse 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1000" height="360" rx="16" fill="url(#modesBg)" stroke="#1e293b" stroke-width="1.5" />
  <g transform="translate(50, 36)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="65" y="16" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">CORE MODULES</text>
    <text x="0" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900">Engineered for Training, Competition &amp; Mastery</text>
  </g>
  <!-- Card 1 -->
  <g class="card-1" transform="translate(50, 110)">
    <rect width="210" height="210" rx="14" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="1" y="1" width="208" height="4" rx="2" fill="#f59e0b" />
    <circle cx="45" cy="45" r="22" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.2" />
    <text x="45" y="52" text-anchor="middle" fill="#fde047" font-size="20">⚔️</text>
    <circle cx="185" cy="45" r="4" fill="#f59e0b" class="live-dot" />
    <text x="24" y="96" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold">PLAY ARENA</text>
    <text x="24" y="118" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">3D Sandbox Sandbox</text>
    <text x="24" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Real-Time FIDE Validator</text>
    <text x="24" y="168" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Move Rewind &amp; FEN Export</text>
    <text x="24" y="188" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">• 4 Orbit Camera Presets</text>
  </g>
  <!-- Card 2 -->
  <g class="card-2" transform="translate(285, 110)">
    <rect width="210" height="210" rx="14" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="1" y="1" width="208" height="4" rx="2" fill="#38bdf8" />
    <circle cx="45" cy="45" r="22" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.2" />
    <text x="45" y="52" text-anchor="middle" fill="#7dd3fc" font-size="20">👥</text>
    <circle cx="185" cy="45" r="4" fill="#38bdf8" class="live-dot" />
    <text x="24" y="96" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold">2 PLAYER PASS &amp; PLAY</text>
    <text x="24" y="118" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Local Over-the-Board</text>
    <text x="24" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Fischer Incremental Clocks</text>
    <text x="24" y="168" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Auto 180° Board Flip</text>
    <text x="24" y="188" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">• Material Differential HUD</text>
  </g>
  <!-- Card 3 -->
  <g class="card-3" transform="translate(520, 110)">
    <rect width="210" height="210" rx="14" fill="url(#cardGrad1)" stroke="#c084fc" stroke-width="1.5" />
    <rect x="1" y="1" width="208" height="4" rx="2" fill="#c084fc" />
    <circle cx="45" cy="45" r="22" fill="#581c87" fill-opacity="0.4" stroke="#c084fc" stroke-width="1.2" />
    <text x="45" y="52" text-anchor="middle" fill="#e9d5ff" font-size="20">🎓</text>
    <circle cx="185" cy="45" r="4" fill="#c084fc" class="live-dot" />
    <text x="24" y="96" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold">LEARN ACADEMY</text>
    <text x="24" y="118" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Interactive 3D Curriculum</text>
    <text x="24" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• 3D Board Focus Rings</text>
    <text x="24" y="168" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Animated Move Arrows</text>
    <text x="24" y="188" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">• Multi-Chapter Drills</text>
  </g>
  <!-- Card 4 -->
  <g class="card-4" transform="translate(755, 110)">
    <rect width="210" height="210" rx="14" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5" />
    <rect x="1" y="1" width="208" height="4" rx="2" fill="#10b981" />
    <circle cx="45" cy="45" r="22" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2" />
    <text x="45" y="52" text-anchor="middle" fill="#a7f3d0" font-size="20">🧩</text>
    <circle cx="185" cy="45" r="4" fill="#10b981" class="live-dot" />
    <text x="24" y="96" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold">TACTICAL PUZZLES</text>
    <text x="24" y="118" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Rating Tiered Training</text>
    <text x="24" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Pins, Forks &amp; Skewers</text>
    <text x="24" y="168" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Real-Time Step Validation</text>
    <text x="24" y="188" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">• Streak &amp; Mistake Counters</text>
  </g>
</svg>
